spring:
  config:
    import:
      - "configtree:${SUPPLYMIND_SECRETS_DIR:/run/secrets/}"

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:supplymind_db}
    username: ${DB_APP_USER:supplymind_app}
    password: ${db_app_password.txt}
    hikari:
      schema: platform

  flyway:
    url: ${spring.datasource.url}
    user: ${DB_MIGRATOR_USER:supplymind_migrator}
    password: ${db_migrator_password.txt}
    placeholders:
      appRole: ${DB_APP_USER:supplymind_app}
      migratorRole: ${DB_MIGRATOR_USER:supplymind_migrator}

  jpa:
    show-sql: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.scalke.kuamojabackend: DEBUG
    org.flywaydb: INFO

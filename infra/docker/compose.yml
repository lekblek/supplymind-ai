services:
  postgres-app:
    image: postgres:19.0
    container_name: supply-mind-db

    stop_grace_period: 30s
    shm_size: 256mb

    labels:
      org.springframework.boot.ignore: "true"

    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME required}
      POSTGRES_USER: ${DB_ADMIN_USER:?DB_ADMIN_USER required}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      DB_APP_USER: ${DB_APP_USER:?DB_APP_USER required}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:?DB_MIGRATOR_USER required}
      TZ: Etc/UTC

    secrets:
      - db_admin_password
      - db_migrator_password
      - db_app_password

    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro

    networks:
      - app-network

    healthcheck:
      test: [
        "CMD-SHELL",
        'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s


  backend:
    build:
      context: ../../apps/supplymind-backend
      dockerfile: Dockerfile
    container_name: supply-mind-api

    image: supplymind-ai/backend:local

    restart: unless-stopped

    depends_on:
      postgres-app:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST:  supply-mind-db
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_NAME: ${DB_NAME:?DB_NAME required}
      DB_APP_USER: ${DB_APP_USER:?DB_APP_USER required}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:?DB_MIGRATOR_USER required}
      SUPPLYMIND_SECRETS_DIR: /run/secrets/
      SERVER_ADDRESS: 0.0.0.0

    secrets:
      - source: db_migrator_password
        target: db_migrator_password.txt
      - source: db_app_password
        target: db_app_password.txt

    networks:
      - app-network

    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge

secrets:
  db_admin_password:
    file: ./secrets/postgres/db_admin_password.txt
  db_migrator_password:
    file: ./secrets/postgres/db_migrator_password.txt
  db_app_password:
    file: ./secrets/postgres/db_app_password.txt
